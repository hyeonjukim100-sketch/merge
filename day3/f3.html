<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // [1] 함수 정의: f 라는 이름의 "계산기"를 만든다 (아직 실행되지는 않음)
        //  - ( { a, b, z } ) : 객체 하나를 받아서 그 안의 a, b, z 값을 바로 꺼내 쓴다
        //    (구조분해 할당: const {a, b, z} = 받은객체 와 같은 뜻)
        //  - => : 화살표 함수 문법. function f(...) { } 의 짧은 표현
        const f= ( { a, b, z } ) => {//i변수에는 객체가 온다 {"a":10}
            //console.log(i)
            // [2] 계산해서 돌려준다(return): a x 10 x b 를 먼저 곱하고, 마지막에 z를 더함
            //     곱셈이 덧셈보다 먼저 계산된다. 10 x 10 x 1000 = 100000, 거기에 + 5
            return a*10*b+z
        }
        //사용하는 쪽에서 호출(call) =>실행
        // [3] 함수에 넣어 줄 재료(객체). 이름(키): 값 형태의 묶음이다
        //     f 가 꺼내 쓰는 a, b, z 와 키 이름이 같아야 값이 연결된다
        let u= {"a":10,"b":1000, "z":5}//변수u에는 객체가 저장되어있다
        // [4] f 를 실행(호출)하면서 u를 넘긴다 → 계산 결과 100005 가 변수 a 에 담긴다
        //     (여기 a는 함수 안의 a(=10)와 이름만 같은 별개의 변수다)
        let a= f(u)
        // [5] 결과를 브라우저 콘솔(F12 → Console)에 출력한다 → 100005
        console.log(a)
    </script>
</body>
</html>
