<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const f= (i) => {//i변수에는 객체가 온다
            console.log(i)
            return i.a*10*i.b
        }
        //사용하는 쪽에서 호출(call) =>실행
        let u= {"a":10,"b":1000}//변수u에는 객체가 저장되어있다
        let a= f(u)
        console.log(a)
    </script>
</body>
</html>
